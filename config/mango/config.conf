# MangoWC Configuration
# Ported from Hyprland config with DMS integration

# === Monitor ===
monitorrule=name:DP-1,width:3840,height:2160,refresh:60,x:0,y:0,scale:1.5,vrr:0,rr:0

# === Appearance ===
borderpx=2
border_radius=24
focuscolor=0xe08b0bff
bordercolor=0x60605fff
rootcolor=0x212121ff
gappih=7
gappiv=7
gappoh=7
gappov=7
focused_opacity=1.0
unfocused_opacity=0.9
blur=1
blur_params_radius=8
shadows=1

# === Animations ===
animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=300
animation_duration_close=300

# === Layout ===
default_mfact=0.55
default_nmaster=1
new_is_master=0

# === Input ===
repeat_rate=25
repeat_delay=600

# === Environment ===
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# === Startup ===
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start mango-session.target
exec-once=/usr/bin/dms run --session
exec-once=hyprpaper
exec-once=wl-paste --type text --watch cliphist store

# === Layer Rules ===
layerrule=noanim:1,layer_name:^dms

# === DMS Overrides ===
source=~/.config/mango/dms/colors.conf
source=~/.config/mango/dms/layout.conf
source=~/.config/mango/dms/outputs.conf

# === Application Launchers ===d
bind=SUPER,t,spawn,ghostty
bind=SUPER,b,spawn,MOZ_ENABLE_WAYLAND=1 zen-browser
bind=SUPER,e,spawn,dolphin
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,v,spawn,dms ipc call clipboard toggle
bind=SUPER,m,spawn,dms ipc call processlist focusOrToggle
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle
bind=SUPER,y,spawn,dms ipc call dankdash wallpaper
bind=SUPER,Tab,spawn,dms ipc call hypr toggleOverview
bind=SUPER,x,spawn,dms ipc call powermenu toggle

# === Cheat Sheet ===
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle hyprland

# === Security ===
bind=SUPER+ALT,l,spawn,dms ipc call lock lock
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,spawn,dms ipc call processlist focusOrToggle

# === Audio Controls ===
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bindl=NONE,XF86AudioPause,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous
bindl=NONE,XF86AudioNext,spawn,dms ipc call mpris next

# === Brightness Controls ===
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""

# === Window Management ===
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER+SHIFT,t,togglefloating,
bind=SUPER,w,spawn,echo group
bind=SUPER,r,switch_layout,
bind=SUPER+SHIFT,r,reload_config,

# === Focus Navigation (vim keys + arrows) ===
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# === Window Movement (vim keys + arrows) ===
bind=SUPER+SHIFT,h,movewindow,left
bind=SUPER+SHIFT,j,movewindow,down
bind=SUPER+SHIFT,k,movewindow,up
bind=SUPER+SHIFT,l,movewindow,right
bind=SUPER+SHIFT,Left,movewindow,left
bind=SUPER+SHIFT,Down,movewindow,down
bind=SUPER+SHIFT,Up,movewindow,up
bind=SUPER+SHIFT,Right,movewindow,right

# === Monitor Navigation ===
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right

# === Move to Monitor ===
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# === Workspace/Tag Navigation ===
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# === Move to Workspace/Tag ===
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# === Relative Workspace Navigation ===
bind=SUPER,Page_Down,viewtoright_have_client,
bind=SUPER,Page_Up,viewtoleft_have_client,
bind=SUPER,u,viewtoright_have_client,
bind=SUPER,i,viewtoleft_have_client,

# === Move to Relative Workspace ===
bind=SUPER+SHIFT,Page_Down,tagtoright,
bind=SUPER+SHIFT,Page_Up,tagtoleft,
bind=SUPER+SHIFT,u,tagtoright,
bind=SUPER+SHIFT,i,tagtoleft,

# === Sizing ===
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05
bind=SUPER+SHIFT,minus,incgaps,-2
bind=SUPER+SHIFT,equal,incgaps,+2

# === Master Count ===
bind=SUPER,bracketleft,incnmaster,-1
bind=SUPER,bracketright,incnmaster,+1

# === Mouse Bindings ===
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# === Scroll Wheel Workspace Navigation ===
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft

# === Screenshots ===
bind=NONE,Print,spawn,dms screenshot
bind=CTRL,Print,spawn,dms screenshot full
bind=ALT,Print,spawn,dms screenshot window

# === System Controls ===
bind=SUPER+SHIFT,p,spawn,mmsg -d toggle_monitor
