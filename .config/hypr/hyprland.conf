source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/layout.conf
general {
    col.active_border = rgb(e08b0b)
    col.inactive_border = rgb(212121)
}

input {
  float_switch_override_focus=0
  follow_mouse=2
  mouse_refocus=1
  numlock_by_default=true
}

# Fixes the weird issue where the cursor wouldn't go all the way to the right side
cursor {
  no_hardware_cursors = true
}

# xwayland {
#     force_zero_scaling = true
# }

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = PATH,$PATH:/usr/local/go/bin

decoration {
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace rofi

# Allow Hyprland to open programs in the initial workspace, regardless of current mouse position
misc:initial_workspace_tracking = 1

# exec-once = hyprpaper
# exec-once = waybar
# exec-once = hyprpanel

# For Dank Materials Shell https://danklinux.com/docs/dankmaterialshell
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start graphical-session.target
exec-once = /usr/bin/dms run --session

# Spotify on workspace S
exec-once = spotify
windowrule {
  name = windowrule-1
  workspace = name:S
  match:class = ^(Spotify)$
}

source = ./dms/outputs.conf
