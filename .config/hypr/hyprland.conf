source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/layout.conf
general {
    col.active_border = rgb(e08b0b)
    col.inactive_border = rgb(212121)
}

input {
    follow_mouse = 2
}

env = QT_QPA_PLATFORMTHEME,qt6ct

decoration {
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace rofi

exec-once = hyprpaper
# exec-once = waybar
# exec-once = hyprpanel

# For Dank Materials Shell https://danklinux.com/docs/dankmaterialshell
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start graphical-session.target
exec-once = /usr/bin/dms run --session

