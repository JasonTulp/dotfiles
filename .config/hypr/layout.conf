general {
    gaps_in = 5
    gaps_out = 8
}

dwindle {
    # keep a split's axis once it is made, instead of re-deriving it from the
    # container's aspect ratio — needed so scripts/stack-right-monitor.py can
    # hold the right (portrait) monitor to top/bottom splits
    preserve_split = true
}

decoration {
    rounding = 10
}
