$mainMod = SUPER
$sws = ~/.config/hypr/scripts/session-ws.sh
$terminal = ghostty
$browser = MOZ_ENABLE_WAYLAND=1 zen-browser
$filemanager = dolphin
$ide = idea

bind = SUPER, T, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, E, exec, $filemanager
bind = SUPER, C, exec, $terminal -e /home/jason/.local/bin/claude
bind = SUPER, W, exec, $terminal -e zsh -ic hel
bind = SUPER SHIFT, W, exec, zsh -ic hel

bind = $mainMod SHIFT, R, exec, pkill -x dms; sleep 0.5 && /usr/bin/dms run --session

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, space, exec, rofi -show drun
bind = , Print, exec, sleep 0.3 && grimblast --freeze copy area

# Window Movement/ resizing with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize active window with keyboard
binde = $mainMod, equal, resizeactive, 40 40
binde = $mainMod, minus, resizeactive, -40 -40

bind = $mainMod, F, togglefloating

# TV through the wall — game display only, never part of a session
bind = $mainMod, G, exec, ~/.config/hypr/scripts/game-mode.sh toggle
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/tv-send.sh
bind = $mainMod ALT, G, exec, ~/.config/hypr/scripts/tv-mirror.sh

# Window focus with keys
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cycle between sessions with wraparound (right = up, left = down)
bind = $mainMod, right, exec, ~/.config/hypr/scripts/session-cycle.sh next
bind = $mainMod, left, exec, ~/.config/hypr/scripts/session-cycle.sh prev

# Window movement with keys
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Used to swap the current split order (Swap windows around)
bind = $mainMod, X, layoutmsg, swapsplit

# Move window to workspace 1–9 (current session)
bind = $mainMod SHIFT, 1, exec, $sws movetoworkspace 1
bind = $mainMod SHIFT, 2, exec, $sws movetoworkspace 2
bind = $mainMod SHIFT, 3, exec, $sws movetoworkspace 3
bind = $mainMod SHIFT, 4, exec, $sws movetoworkspace 4
bind = $mainMod SHIFT, 5, exec, $sws movetoworkspace 5
bind = $mainMod SHIFT, 6, exec, $sws movetoworkspace 6
bind = $mainMod SHIFT, 7, exec, $sws movetoworkspace 7
bind = $mainMod SHIFT, 8, exec, $sws movetoworkspace 8
bind = $mainMod SHIFT, 9, exec, $sws movetoworkspace 9

# Move window to workspace 10
bind = $mainMod SHIFT, 0, exec, $sws movetoworkspace 10
bind = $mainMod SHIFT, S, movetoworkspace, name:S
bind = $mainMod SHIFT, N, movetoworkspace, name:N
bind = $mainMod SHIFT, A, movetoworkspace, name:A
bind = $mainMod SHIFT, D, movetoworkspace, name:D
bind = $mainMod SHIFT, M, movetoworkspace, name:M

# Switch to workspace 1–9 (current session)
bind = $mainMod, 1, exec, $sws workspace 1
bind = $mainMod, 2, exec, $sws workspace 2
bind = $mainMod, 3, exec, $sws workspace 3
bind = $mainMod, 4, exec, $sws workspace 4
bind = $mainMod, 5, exec, $sws workspace 5
bind = $mainMod, 6, exec, $sws workspace 6
bind = $mainMod, 7, exec, $sws workspace 7
bind = $mainMod, 8, exec, $sws workspace 8
bind = $mainMod, 9, exec, $sws workspace 9

# Workspace 10 = 0 key
bind = $mainMod, 0, exec, $sws workspace 10
bind = $mainMod, S, workspace, name:S
bind = $mainMod, N, workspace, name:N
bind = $mainMod, A, workspace, name:A
bind = $mainMod, D, workspace, name:D
bind = $mainMod, M, workspace, name:M

# Sessions — swap the whole desk, every workspace preserved
bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/session-switch.sh 1
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/session-switch.sh 2
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/session-switch.sh 3
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/session-switch.sh 4
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/session-switch.sh 1
bind = $mainMod, F2, exec, ~/.config/hypr/scripts/session-switch.sh 2
bind = $mainMod, F3, exec, ~/.config/hypr/scripts/session-switch.sh 3
bind = $mainMod, F4, exec, ~/.config/hypr/scripts/session-switch.sh 4

# Move active window to session and follow it
bind = $mainMod CTRL SHIFT, 1, exec, ~/.config/hypr/scripts/session-move.sh 1
bind = $mainMod CTRL SHIFT, 2, exec, ~/.config/hypr/scripts/session-move.sh 2
bind = $mainMod CTRL SHIFT, 3, exec, ~/.config/hypr/scripts/session-move.sh 3
bind = $mainMod CTRL SHIFT, 4, exec, ~/.config/hypr/scripts/session-move.sh 4
bind = $mainMod SHIFT, F1, exec, ~/.config/hypr/scripts/session-move.sh 1
bind = $mainMod SHIFT, F2, exec, ~/.config/hypr/scripts/session-move.sh 2
bind = $mainMod SHIFT, F3, exec, ~/.config/hypr/scripts/session-move.sh 3
bind = $mainMod SHIFT, F4, exec, ~/.config/hypr/scripts/session-move.sh 4

# Sessions (numpad)
bind = $mainMod CTRL, KP_End, exec, ~/.config/hypr/scripts/session-switch.sh 1
bind = $mainMod CTRL, KP_Down, exec, ~/.config/hypr/scripts/session-switch.sh 2
bind = $mainMod CTRL, KP_Next, exec, ~/.config/hypr/scripts/session-switch.sh 3
bind = $mainMod CTRL, KP_Left, exec, ~/.config/hypr/scripts/session-switch.sh 4
bind = $mainMod CTRL SHIFT, KP_End, exec, ~/.config/hypr/scripts/session-move.sh 1
bind = $mainMod CTRL SHIFT, KP_Down, exec, ~/.config/hypr/scripts/session-move.sh 2
bind = $mainMod CTRL SHIFT, KP_Next, exec, ~/.config/hypr/scripts/session-move.sh 3
bind = $mainMod CTRL SHIFT, KP_Left, exec, ~/.config/hypr/scripts/session-move.sh 4

# Switch to workspace 1–9 (numpad, current session)
bind = $mainMod, KP_End, exec, $sws workspace 1
bind = $mainMod, KP_Down, exec, $sws workspace 2
bind = $mainMod, KP_Next, exec, $sws workspace 3
bind = $mainMod, KP_Left, exec, $sws workspace 4
bind = $mainMod, KP_Begin, exec, $sws workspace 5
bind = $mainMod, KP_Right, exec, $sws workspace 6
bind = $mainMod, KP_Home, exec, $sws workspace 7
bind = $mainMod, KP_Up, exec, $sws workspace 8
bind = $mainMod, KP_Prior, exec, $sws workspace 9

# Workspace 10 = numpad 0
bind = $mainMod, KP_Insert, exec, $sws workspace 10

# Move window to workspace 1–9 (numpad, current session)
bind = $mainMod SHIFT, KP_End, exec, $sws movetoworkspace 1
bind = $mainMod SHIFT, KP_Down, exec, $sws movetoworkspace 2
bind = $mainMod SHIFT, KP_Next, exec, $sws movetoworkspace 3
bind = $mainMod SHIFT, KP_Left, exec, $sws movetoworkspace 4
bind = $mainMod SHIFT, KP_Begin, exec, $sws movetoworkspace 5
bind = $mainMod SHIFT, KP_Right, exec, $sws movetoworkspace 6
bind = $mainMod SHIFT, KP_Home, exec, $sws movetoworkspace 7
bind = $mainMod SHIFT, KP_Up, exec, $sws movetoworkspace 8
bind = $mainMod SHIFT, KP_Prior, exec, $sws movetoworkspace 9

# Move window to workspace 10 (numpad)
bind = $mainMod SHIFT, KP_Insert, exec, $sws movetoworkspace 10

# Volume controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls (works with media keys or mouse buttons configured to send these)
bind = , XF86AudioPlay, exec, playerctl -p spotify play-pause
bind = , XF86AudioPause, exec, playerctl -p spotify pause
bind = , XF86AudioPlayPause, exec, playerctl -p spotify play-pause
bind = , XF86AudioNext, exec, playerctl -p spotify next
bind = , XF86AudioPrev, exec, playerctl -p spotify previous
