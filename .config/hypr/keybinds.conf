$mainMod = SUPER
$terminal = ghostty
$browser = MOZ_ENABLE_WAYLAND=1 zen-browser
$filemanager = dolphin
$ide = idea

bind = SUPER, T, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, E, exec, $filemanager
bind = SUPER, C, exec, $terminal -e /home/jason/.local/bin/claude
bind = SUPER, W, exec, $terminal -e zsh -ic hel
bind = SUPER SHIFT, W, exec, zsh -ic hel

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, space, exec, rofi -show drun
bind = , Print, exec, sleep 0.3 && grimblast --freeze copy area

# Window Movement/ resizing with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize active window with keyboard
binde = $mainMod, equal, resizeactive, 40 40
binde = $mainMod, minus, resizeactive, -40 -40

bind = $mainMod, F, togglefloating

# Window focus with keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window movement with keys
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Used to swap the current split order (Swap windows around)
bind = $mainMod, X, swapsplit

# Move window to workspace 1–9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move window to workspace 10
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, S, movetoworkspace, name:S

# Switch to workspace 1–9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Workspace 10 = 0 key
bind = $mainMod, 0, workspace, 10
bind = $mainMod, S, workspace, name:S

# Switch to workspace 1–9 (numpad)
bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, KP_Prior, workspace, 9

# Workspace 10 = numpad 0
bind = $mainMod, KP_Insert, workspace, 10

# Move window to workspace 1–9 (numpad)
bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 7
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 8
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 9

# Move window to workspace 10 (numpad)
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 10

# Volume controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls (works with media keys or mouse buttons configured to send these)
bind = , XF86AudioPlay, exec, playerctl -p spotify play-pause
bind = , XF86AudioPause, exec, playerctl -p spotify pause
bind = , XF86AudioPlayPause, exec, playerctl -p spotify play-pause
bind = , XF86AudioNext, exec, playerctl -p spotify next
bind = , XF86AudioPrev, exec, playerctl -p spotify previous
