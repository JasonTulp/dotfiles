add_newline = true
format = """
[░▒▓](#F57600)\
[ 󰈸 ](bg:#F57600 fg:#000000)\
$directory\
[](fg:#F57600 bg:#724216)\
$git_branch\
$git_status\
[](fg:#724216 bg:#3D2D1E)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#3D2D1E)\
$fill\
[](fg:#3D2D1E)\
$cmd_duration\
[](fg:#57371A bg:#3D2D1E)\
$time\
\n$character"""

[fill]
symbol=" "

[cmd_duration]
min_time = 100
format = '[ $duration ](bold fg:#FFEAD6 bg:#3D2D1E)'

[character]
success_symbol = "[░▒▓ ](#F57600)"
error_symbol = "[░▒▓ ](#FD0000)"
vimcmd_symbol = "[](green)"

[directory]
style = "fg:#000000 bg:#F57600 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#724216"
format = '[[ $symbol $branch ](fg:#EEEEEE bg:#724216)]($style)'

[git_status]
style = "bg:#724216"
format = '[[($all_status$ahead_behind )](fg:#EEEEEE bg:#724216)]($style)'

[nodejs]
symbol = ""
style = "bg:#3D2D1E"
format = '[[ $symbol ($version) ](fg:#DDDDDD bg:#3D2D1E)]($style)'

[rust]
symbol = ""
style = "bg:#3D2D1E"
format = '[[ $symbol ($version) ](fg:#DDDDDD bg:#3D2D1E)]($style)'

[golang]
symbol = ""
style = "bg:#3D2D1E"
format = '[[ $symbol ($version) ](fg:#DDDDDD bg:#3D2D1E)]($style)'

[php]
symbol = ""
style = "bg:#3D2D1E"
format = '[[ $symbol ($version) ](fg:#DDDDDD bg:#3D2D1E)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#240D05"
format = '[[  $time ](fg:#FFEAD6 bg:#57371A)]($style)'

